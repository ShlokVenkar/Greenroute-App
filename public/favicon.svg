<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0d231e" />
      <stop offset="100%" stopColor="#02080a" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="12" y1="12" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#6ee7b7" />
      <stop offset="50%" stopColor="#10b981" />
      <stop offset="100%" stopColor="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#10b981" stroke-width="2" stroke-opacity="0.4" />

  <!-- Ambient Light -->
  <circle cx="32" cy="32" r="20" fill="#10b981" opacity="0.15" />

  <!-- Aerodynamic 'G' Emergency Wave Road -->
  <path
    d="
      M 46 22
      C 42 15 35 12 28 13
      C 18 15 11 23 11 33
      C 11 44 19 51 30 51
      C 41 51 49 43 51 33
      L 34 33
    "
    stroke="url(#waveGrad)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Road Dashes -->
  <path
    d="M 23 23 C 20 28 20 37 25 41 C 29 44 37 44 42 39"
    stroke="#a7f3d0"
    stroke-width="2"
    stroke-linecap="round"
    stroke-dasharray="4 4"
    opacity="0.9"
  />

  <!-- Green Signal Pulse Beacon -->
  <circle cx="46" cy="22" r="4.5" fill="#34d399" filter="url(#glow)" />
  <circle cx="46" cy="22" r="2" fill="#ffffff" />

  <!-- Signal Wave Rings -->
  <path d="M 52 17 C 55 20 55 25 52 28" stroke="#34d399" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M 57 13 C 62 18 62 27 57 32" stroke="#34d399" stroke-width="1.6" stroke-linecap="round" opacity="0.4" />
</svg>